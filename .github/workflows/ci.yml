name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check formatting
        run: make lint
      - name: Run tests
        run: swift test

  release:
    name: Build and publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag and target branch
        id: version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use SemVer format vX.Y.Z (got '$tag')." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build drag-and-drop disk image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: Scripts/build-dmg.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Nyathing ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: dist/nyathing-${{ steps.version.outputs.value }}.dmg
          fail_on_unmatched_files: true
