name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check formatting
        run: make lint
      - name: Run tests
        run: swift test

  build-cli-artifact:
    name: Build downloadable CLI archive
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    needs: test
    runs-on: macos-26
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Build CLI archive
        run: Scripts/package-cli.sh
      - name: Test installed archive
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/nyathing-prefix"
          config="$RUNNER_TEMP/nyathing-config"
          mkdir -p "$prefix" "$config"
          PREFIX="$prefix" bash out/nyathing-macos-arm64/install.sh
          XDG_CONFIG_HOME="$config" "$prefix/bin/nyathing" list
          test -x "$prefix/libexec/nyathing/nyathing"
          test -d "$prefix/libexec/nyathing/Nyathing_Nyathing.bundle"
      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: nyathing-macos-arm64
          path: out/nyathing-macos-arm64/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build and publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag and target branch
        id: version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use SemVer format vX.Y.Z (got '$tag')." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build CLI archive
        run: Scripts/package-cli.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Nyathing ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: out/nyathing-macos-arm64.tar.gz
          fail_on_unmatched_files: true
